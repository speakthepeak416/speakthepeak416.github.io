<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemhop</title>
<style>
:root{--bg:#e9eefb;--panel:#fff;--ink:#1b2340;--accent:#6c4bff;--line:#c4cdec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1121;--panel:#1b2140;--ink:#eaf0ff;--accent:#9a85ff;--line:#2d3566;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1121;--panel:#1b2140;--ink:#eaf0ff;--accent:#9a85ff;--line:#2d3566;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}
canvas{display:block;image-rendering:pixelated;border-radius:12px;box-shadow:0 8px 30px #0006}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:#0b1030c4;color:#fff;border-radius:12px;padding:16px;backdrop-filter:blur(3px)}
#ov.h{display:none}
#ov h1{margin:0;font-size:clamp(26px,8vw,46px);letter-spacing:.08em}
#ov p{margin:0;opacity:.88;font-size:clamp(12px,3.2vw,15px);line-height:1.5}
#go{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 30px;font:700 16px system-ui,sans-serif;margin-top:8px;cursor:pointer}
#pad{display:none;justify-content:space-between;align-items:center;padding:8px 20px 14px}
@media (pointer:coarse){#pad{display:flex}}
.dir{display:flex;gap:14px}
.b{width:74px;height:74px;border-radius:50%;background:var(--panel);color:var(--ink);border:2px solid var(--line);font:700 26px system-ui,sans-serif;display:grid;place-items:center;touch-action:none;padding:0}
.b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#jump{width:100px;height:100px;font-size:16px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c"></canvas>
<div id="ov"><h1 id="t">GEMHOP</h1><p id="d"></p><button id="go">Play</button></div></div></div>
<div id="pad"><div class="dir"><button class="b" id="bl" aria-label="Left">◀</button><button class="b" id="br" aria-label="Right">▶</button></div><button class="b" id="jump">JUMP</button></div>
<script>
const W=384,H=224,T=16,ROWS=14,$=i=>document.getElementById(i),fl=Math.floor;
const cv=$('c'),g=cv.getContext('2d');cv.width=W;cv.height=H;
if(!g.roundRect)g.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),md=(a,m)=>((a%m)+m)%m;
const K={l:0,r:0,j:0,jp:0};
let state='title',n=1,score=0,lvScore=0,hp=3,gotG=0,lv,P,cam=0,tick=0,shake=0,parts=[],safe,jbuf=0,best=0,bg,ac,shots=[],bp={},GY=10*T;
try{best=+localStorage.getItem('gemhop')||0}catch(e){}
const PAL=[
{a:'#6ec6ff',b:'#e4f7ff',h0:'#a8dcc0',h1:'#7cc79c',gr:'#5fd35f',d0:'#8a5a3b',d1:'#6e4529'},
{a:'#3a2a7a',b:'#ff9f80',h0:'#7a5aa8',h1:'#553a86',gr:'#b9e36a',d0:'#5e3a60',d1:'#472b49'},
{a:'#080c2a',b:'#2a4a8a',h0:'#1f2f66',h1:'#16224d',gr:'#4fd1c0',d0:'#2a3a72',d1:'#1d2a58',st:1}];

/* audio */
function snd(a,b,d=.12,ty='square',v=.05){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),u=ac.createGain(),t0=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(a,t0);o.frequency.exponentialRampToValueAtTime(b,t0+d);u.gain.setValueAtTime(v,t0);u.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(u);u.connect(ac.destination);o.start();o.stop(t0+d)}catch(e){}}

/* level generation: seeded, always beatable */
const rng=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* 20 bosses: name, body, accent, shape, eyes, horns, w, h, hp, attacks, movement, rate */
const BOSS=[
['Gloop King','#6bd66b','#1f7a35',1,2,0,36,30,5,[4],2,1],
['Cinder Imp','#ff7a3d','#ffd166',2,2,2,26,30,4,[0,1],0,1],
['Frost Wisp','#9fe8ff','#4aa8d8',1,1,0,28,28,4,[3],5,1],
['Stone Golem','#8d97a8','#7e8aa3',0,2,0,40,40,7,[4,2],1,1],
['Void Eye','#3a1f6b','#c77dff',1,1,0,28,28,5,[5],3,1],
['Thunder Hawk','#ffe45c','#b88a00',2,2,1,30,26,5,[0,7],4,1],
['Moss Wraith','#5fb58a','#1d4d3a',1,2,0,30,32,5,[1],3,.9],
['Magma Crab','#e8452c','#ffb347',0,2,2,40,28,6,[2,1],1,1],
['Pink Puff','#ff9ad0','#c2397c',1,2,0,36,34,5,[7],0,1.1],
['Clockwork Crow','#b0865a','#f2c14e',2,1,1,28,28,5,[0,5],5,1],
['Sand Pharaoh','#e6c36a','#a0702a',0,2,1,32,38,6,[1,4],2,1],
['Neon Jelly','#4dffd0','#0b8f74',1,3,0,34,30,5,[3,6],4,1],
['Bone Baron','#eee8d6','#a89a6a',0,2,2,32,36,6,[0,6],1,1],
['Storm Squid','#5c7cff','#bcd0ff',1,2,3,34,32,6,[2,5],0,1],
['Rust Titan','#a8603a','#e0884a',0,1,0,40,40,8,[4,7],2,1.1],
['Lava Serpent','#ff5f5f','#ffd0a0',2,2,1,36,24,6,[3,0],5,1],
['Mirror Phantom','#d0d9ff','#6a78c0',2,3,0,30,34,5,[1,7],3,.9],
['Thorn Beast','#3f9a3f','#c8f06a',0,3,3,38,34,7,[2,6],1,1],
['Cosmic Whale','#6a4cff','#9fe8ff',1,2,0,40,32,8,[7,5],4,1.1],
['Gem Tyrant','#ff4f9a','#ffd166',2,3,3,38,38,9,[1,2,5],0,1.2]];
const CD=[85,135,100,10,140,170,260,150];
/* boss arena every 10th level, boss picked at random */
function arena(k){
 const LW=24,map=new Uint8Array(LW*ROWS),bn=k/10;
 for(let x=0;x<LW;x++)for(let y=10;y<ROWS;y++)map[y*LW+x]=1;
 [[3,7],[4,7],[5,7],[18,7],[19,7],[20,7],[10,4],[11,4],[12,4],[13,4]].forEach(([x,y])=>map[y*LW+x]=2);
 if(!(k in bp)){let i;do i=fl(Math.random()*20);while(i===bp.last);bp[k]=bp.last=i}
 const d=BOSS[bp[k]],sp=1+Math.min(bn*.05,.6),hp=d[8]+fl(bn/4);
 return{LW,map,gems:[],ens:[],flag:null,boss:{d,x:W/2-d[6]/2,y:GY-d[7],w:d[6],h:d[7],hp,max:hp,t:0,inv:0,f:0,dead:0,vx:0,vy:0,sp,tm:d[9].map(()=>0)}};
}
function gen(k){
 if(k%10==0)return arena(k);
 const r=rng(k*7919+17),LW=84+k*12,map=new Uint8Array(LW*ROWS),gems=[],ens=[];
 const set=(x,y,v)=>{if(x>=0&&x<LW&&y>=0&&y<ROWS)map[y*LW+x]=v};
 const run=(x,l,h)=>{for(let i=0;i<l;i++)for(let y=h;y<ROWS;y++)set(x+i,y,1)};
 const G=(x,y)=>gems.push({x,y,got:0}),mg=Math.min(4,2+(k>>1));
 let x=7,gy=10;run(0,7,gy);
 while(x<LW-14){
  const q=fl(r()*(k>1?7:5));
  if(q==0){const l=3+fl(r()*4);run(x,l,gy);for(let i=0;i<l;i+=2)G(x+i+.5,gy-1.5);x+=l}
  else if(q==1){const w=2+fl(r()*(mg-1));for(let i=0;i<w;i++)G(x+i+.5,gy-2-Math.sin(Math.PI*(i+.5)/w)*1.6);x+=w;run(x,3,gy);x+=3}
  else if(q==2){gy=clamp(gy+(r()<.5?-1:1)*(1+fl(r()*2)),6,11);run(x,4,gy);G(x+2,gy-1.5);x+=4}
  else if(q==3){const s=2+(k>3?1:0);run(x,s+4,gy);for(let i=0;i<s;i++)set(x+2+i,gy-1,3);G(x+2+s/2,gy-2.6);x+=s+4}
  else if(q==4){run(x,8,gy);ens.push({x:x*T+4,y:gy*T-10,x0:x*T+4,x1:(x+8)*T-16,dir:1,vx:.35+k*.04,alive:1,t:0});x+=8}
  else if(q==5){run(x+5,3,gy);set(x+2,gy-2,2);set(x+3,gy-2,2);G(x+3,gy-3.5);x+=8}
  else{run(x,8,gy);set(x+1,gy-2,2);set(x+2,gy-2,2);set(x+4,gy-4,2);set(x+5,gy-4,2);G(x+2,gy-3.5);G(x+5,gy-5.5);x+=8}
 }
 run(x,LW-x,gy);
 return{LW,map,gems,ens,flag:{x:(LW-5)*T,y:gy*T-48}};
}
const tile=(x,y)=>x<0||x>=lv.LW?1:y<0||y>=ROWS?0:lv.map[y*lv.LW+x];
function load(k){
 n=k;lv=gen(k);const c=lv.c=PAL[(k-1)%3];
 bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,c.a);bg.addColorStop(1,c.b);
 P={x:2*T,y:10*T-14,w:10,h:14,vx:0,vy:0,ground:true,face:1,coy:0,jumps:0,inv:0,sq:0,gt:0,run:0};
 safe={x:P.x,y:P.y};cam=0;parts=[];shots=[];lvScore=score;gotG=0;jbuf=0;
}
function burst(x,y,k,c,s){for(let i=0;i<k;i++)parts.push({x,y,vx:(Math.random()-.5)*s*2,vy:(Math.random()-.8)*s*2,l:18+Math.random()*20,c})}

/* physics */
function mv(p){
 p.x+=p.vx;
 const a=fl(p.y/T),b=fl((p.y+p.h-.01)/T);
 if(p.vx){const tx=fl((p.vx>0?p.x+p.w:p.x)/T);for(let ty=a;ty<=b;ty++)if(tile(tx,ty)==1){p.x=p.vx>0?tx*T-p.w:(tx+1)*T;p.vx=0;break}}
 const pb=p.y+p.h;p.y+=p.vy;p.ground=false;
 const l=fl(p.x/T),r=fl((p.x+p.w-.01)/T),ty=fl((p.vy>0?p.y+p.h:p.y)/T);
 for(let tx=l;tx<=r;tx++){const t=tile(tx,ty);if(t==1||(t==2&&p.vy>0&&pb<=ty*T+.5)){if(p.vy>0){p.y=ty*T-p.h;p.ground=true}else p.y=(ty+1)*T;p.vy=0;break}}
}
function hurt(k){
 const p=P;if(k!=1&&p.inv>0)return;
 hp--;shake=8;snd(220,60,.3,'sawtooth',.07);burst(p.x+5,p.y+7,14,'#ff5c7a',2);
 if(hp<=0){end(0);return}
 p.inv=110;if(k==1){p.x=safe.x;p.y=safe.y;p.vx=p.vy=0}else{p.vy=-4.2;p.vx=-p.face*2}
}
function end(w){
 state=w?'win':'dead';
 if(w){score+=hp*100;[523,659,784].forEach((f,i)=>setTimeout(()=>snd(f,f*1.3,.16,'triangle'),i*120))}else snd(300,50,.6,'sawtooth',.07);
 if(score>best){best=score;try{localStorage.setItem('gemhop',best)}catch(e){}}
 show(w?'LEVEL '+n+' CLEAR!':'GAME OVER',(lv.boss?lv.boss.d[0]+' defeated':'Gems '+gotG+'/'+lv.gems.length)+' · Score '+score+'<br>Best '+best+(w&&(n+1)%10==0?'<br>Boss battle next!':''),w?'Next level':'Try again');
}
function upd(){
 const p=P,L=lv,ax=K.r-K.l,was=p.ground;
 if(ax){p.vx+=ax*(p.ground?.25:.18);p.face=ax}else p.vx*=p.ground?.78:.95;
 p.vx=clamp(p.vx,-1.7,1.7);if(Math.abs(p.vx)<.02)p.vx=0;
 const press=K.jp;K.jp=0;if(press)jbuf=7;else if(jbuf>0)jbuf--;
 p.coy=p.ground?7:p.coy-1;
 if(jbuf>0){
  if(p.coy>0){p.vy=-6.3;p.coy=0;jbuf=0;p.jumps=1;p.sq=-.25;snd(300,700,.14);burst(p.x+5,p.y+14,5,'#ffffffaa',1)}
  else if(press&&p.jumps<2){p.vy=-5.6;p.jumps=2;jbuf=0;p.sq=-.2;snd(500,1000,.12,'triangle');burst(p.x+5,p.y+14,9,'#fff',1.3)}
 }
 if(!K.j&&p.vy<-2.6)p.vy=-2.6;
 p.vy=Math.min(p.vy+.35,7.5);
 mv(p);
 p.x=clamp(p.x,0,L.LW*T-p.w);
 if(p.ground){if(!was){p.sq=.3;snd(130,60,.08,'sine',.09);burst(p.x+5,p.y+14,6,'#ffffffaa',1)}p.jumps=0;if(++p.gt>20)safe={x:p.x,y:p.y}}else p.gt=0;
 p.run+=Math.abs(p.vx)*.3;p.sq*=.85;if(p.inv>0)p.inv--;
 if(p.y>H+30)hurt(1);
 for(let ty=fl((p.y+6)/T);ty<=fl((p.y+p.h-1)/T);ty++)for(let tx=fl((p.x+2)/T);tx<=fl((p.x+p.w-3)/T);tx++)if(tile(tx,ty)==3&&p.y+p.h>ty*T+9){hurt(2);p.vy=-5}
 for(const e of L.ens){
  if(!e.alive){e.t--;continue}
  e.x+=e.dir*e.vx;if(e.x<e.x0||e.x>e.x1)e.dir*=-1;
  if(p.x+p.w>e.x&&p.x<e.x+12&&p.y+p.h>e.y&&p.y<e.y+10){
   if(p.vy>0&&p.y+p.h-e.y<9+p.vy){e.alive=0;e.t=25;p.vy=K.j?-6.5:-4.5;p.jumps=1;score+=50;snd(500,900,.1);burst(e.x+6,e.y+8,12,'#b88cff',2);shake=3}
   else hurt(0);
  }
 }
 for(const m of L.gems)if(!m.got&&Math.abs(m.x*T-(p.x+5))<11&&Math.abs(m.y*T-(p.y+7))<13){m.got=1;gotG++;score+=10;snd(900+gotG%8*60,1500,.1,'triangle');burst(m.x*T,m.y*T,8,'#7df9ff',1.5)}
 if(L.boss)bossUpd(L.boss);const f=L.flag;if(f&&p.x+p.w>f.x&&p.x<f.x+16&&p.y+p.h>f.y)end(1);
 cam+=(clamp(p.x+5-W/2+p.face*24,0,L.LW*T-W)-cam)*.12;
}

/* boss logic */
function fire(a,B){
 const p=P,bx=B.x+B.w/2,by=B.y+B.h/2,an=Math.atan2(p.y+7-by,p.x+5-bx),c=B.d[2],v=1.3*B.sp,
 sh=(x,y,t,s,o)=>shots.push({x,y,vx:Math.cos(t)*s,vy:Math.sin(t)*s,r:3,c,...o});
 if(a!=3)snd(200,90,.1,'square',.03);
 if(a==0)sh(bx,by,an,v*1.7);
 else if(a==1)for(let i=-2;i<3;i++)sh(bx,by,an+i*.28,v);
 else if(a==2)for(let i=0;i<3;i++)sh(16+Math.random()*(W-32),-6,Math.PI/2,v*.9);
 else if(a==3){B.a=(B.a||0)+.45;sh(bx,by,B.a,v*.85);sh(bx,by,B.a+Math.PI,v*.85)}
 else if(a==4){sh(bx,GY-6,0,v*1.3,{g:1,r:6});sh(bx,GY-6,Math.PI,v*1.3,{g:1,r:6})}
 else if(a==5)sh(bx,by,an,v*.7,{hom:1,l:300,r:4});
 else if(a==6){if(lv.ens.filter(e=>e.alive).length<2)lv.ens.push({x:bx-6,y:GY-10,x0:T,x1:W-T-14,dir:1,vx:.7,alive:1,t:0})}
 else for(let i=0;i<10;i++)sh(bx,by,i*Math.PI/5+B.t*.02,v*.8);
}
function bossUpd(B){
 const p=P,d=B.d,m=d[10],cx=B.x+B.w/2,hw=W/2-B.w/2;
 if(B.dead){if(--B.dead%5==0){burst(B.x+Math.random()*B.w,B.y+Math.random()*B.h,10,d[1],3);snd(150+Math.random()*300,50,.2,'sawtooth',.05);shake=4}if(!B.dead)end(1);return}
 B.t++;if(B.inv>0)B.inv--;if(B.f>0)B.f--;
 if(m==0){B.x=hw+Math.sin(B.t*.02*B.sp)*(hw-12);B.y=GY-B.h-20+Math.sin(B.t*.05)*12}
 else if(m==1){B.y=GY-B.h;if(B.t%80==0)B.vx=Math.sign(p.x-B.x)*(2.4+B.sp);B.vx*=.985;B.x=clamp(B.x+B.vx,6,W-B.w-6)}
 else if(m==2){B.vy+=.3;B.y+=B.vy;if(B.y>=GY-B.h){B.y=GY-B.h;if(B.vy>4){shake=4;snd(90,40,.15,'sine',.1)}B.vy=0;B.vx=0;if(B.t%75==0){B.vy=-8.5;B.vx=Math.sign(p.x-B.x)*1.6*B.sp}}B.x=clamp(B.x+B.vx,6,W-B.w-6)}
 else if(m==3){B.y=GY-B.h;if(B.t%110==0){B.f=26;B.x=12+Math.random()*(W-B.w-24)}}
 else if(m==4){B.x=clamp(B.x+Math.sign(p.x-B.x)*.55*B.sp,6,W-B.w-6);B.y=GY-B.h-20+Math.sin(B.t*.05)*12}
 else{B.x=hw+Math.cos(B.t*.02*B.sp)*(hw-12);B.y=GY-B.h-24+Math.sin(B.t*.04*B.sp)*14}
 if(B.t>70&&B.f<=0)d[9].forEach((a,i)=>{if(++B.tm[i]>=CD[a]*d[11]/B.sp*(B.hp*2<=B.max?.7:1)){B.tm[i]=0;fire(a,B)}});
 if(!B.f&&p.x+p.w>B.x+3&&p.x<B.x+B.w-3&&p.y+p.h>B.y+2&&p.y<B.y+B.h){
  if(p.vy>0&&B.inv<=0&&p.y+p.h-B.y<12+p.vy){
   B.hp--;B.inv=70;p.vy=K.j?-7.5:-6;p.jumps=1;shake=6;snd(200,700,.2,'square',.07);burst(cx,B.y,16,d[1],2.5);
   if(B.hp<=0){B.dead=90;shots.length=0;score+=500;lv.ens.forEach(e=>{e.alive=0;e.t=20})}
  }else if(B.inv<=0)hurt(0);
 }
 for(let i=shots.length-1;i>=0;i--){
  const s=shots[i];
  if(s.hom){const c=Math.atan2(s.vy,s.vx),v=Math.hypot(s.vx,s.vy);let da=Math.atan2(p.y+7-s.y,p.x+5-s.x)-c;da=Math.atan2(Math.sin(da),Math.cos(da));const q=c+clamp(da,-.03,.03);s.vx=Math.cos(q)*v;s.vy=Math.sin(q)*v}
  s.x+=s.vx;s.y+=s.vy;s.l=(s.l||999)-1;
  let x=s.l<=0||s.x<-30||s.x>W+30||s.y>H+30||s.y<-60||(!s.g&&tile(fl(s.x/T),fl(s.y/T))==1);
  if(!x&&Math.hypot(s.x-p.x-5,s.y-p.y-7)<s.r+5){hurt(0);x=1}
  if(x)shots.splice(i,1);
 }
}
function drawBoss(B){
 const d=B.d,{x,y,w,h}=B,p=P,tri=(a,b,c,e)=>{g.beginPath();g.moveTo(a,b);g.lineTo(a+c/2,b-e);g.lineTo(a+c,b);g.fill()};
 g.save();if(B.dead)g.translate((Math.random()-.5)*5,0);
 g.fillStyle=B.inv>0&&(B.inv>>2)&1?'#fff':d[1];g.beginPath();
 if(d[3]==0)g.roundRect(x,y,w,h,8);else if(d[3]==1)g.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);
 else{g.moveTo(x+w/2,y);g.lineTo(x+w,y+h*.45);g.lineTo(x+w*.8,y+h);g.lineTo(x+w*.2,y+h);g.lineTo(x,y+h*.45);g.closePath()}
 g.fill();g.fillStyle=d[2];const by=y+(d[3]==0?5:d[3]==1?h*.28:h*.4),hn=d[5];
 if(hn==1)tri(x+w/2-4,by,8,11);else if(hn==2){tri(x+3,by,8,12);tri(x+w-11,by,8,12)}else if(hn==3)for(let i=0;i<4;i++)tri(x+4+i*(w-16)/3,by,7,9);
 g.fillStyle='#0008';g.fillRect(x+w*.3,y+h*.7,w*.4,3);
 const e=d[4],mad=B.hp*2<=B.max;
 for(let i=0;i<e;i++){const ex=x+w*(i+1)/(e+1)-3;g.fillStyle='#fff';g.fillRect(ex,y+h*.3,6,6);g.fillStyle=mad?'#f22':'#111';g.fillRect(ex+(p.x>x+w/2?2:1),y+h*.3+2,3,3)}
 g.restore();
}
/* rendering */
function hill(f,b,a,col,ph){g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=6){const u=x+cam*f;g.lineTo(x,b-Math.sin(u*.017+ph)*a-Math.sin(u*.041+ph*2)*a*.4)}g.lineTo(W,H);g.fill()}
function heart(x,y,on){g.fillStyle=on?'#ff4f7b':'#00000070';g.fillRect(x-5,y,4,2);g.fillRect(x+1,y,4,2);g.fillRect(x-6,y+2,12,3);g.fillRect(x-4,y+5,8,2);g.fillRect(x-2,y+7,4,1)}
function draw(){
 const L=lv,c=L.c,p=P,cx=fl(cam);
 g.save();
 if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}
 g.fillStyle=bg;g.fillRect(-8,-8,W+16,H+16);
 if(c.st){g.fillStyle='#fff';for(let i=0;i<40;i++){g.globalAlpha=.4+.6*Math.abs(Math.sin(tick*.03+i));g.fillRect(md((i*97)%W-cam*.05*(1+i%3),W),(i*53)%110,1+i%2,1+i%2)}g.globalAlpha=1}
 else{g.fillStyle='#ffffffb0';for(let i=0;i<5;i++){const x=md(i*140-cam*.15+tick*.15,W+120)-60,y=22+(i*37)%60;g.fillRect(x,y,34,8);g.fillRect(x+6,y-6,20,8);g.fillRect(x-4,y+4,42,6)}}
 hill(.2,150,22,c.h0,0);hill(.45,178,18,c.h1,2);
 g.save();g.translate(-cx,0);
 for(let ty=0;ty<ROWS;ty++)for(let tx=fl(cx/T);tx<=fl((cx+W)/T);tx++){
  const t=tile(tx,ty);if(!t)continue;const x=tx*T,y=ty*T;
  if(t==1){g.fillStyle=c.d0;g.fillRect(x,y,T,T);g.fillStyle=c.d1;const s=tx*7+ty*13;g.fillRect(x+s%11+1,y+s%7+4,3,2);g.fillRect(x+(s*3)%9+2,y+(s*5)%6+9,2,2);
   if(tile(tx,ty-1)!=1){g.fillStyle=c.gr;g.fillRect(x,y,T,5);g.fillStyle='#ffffff40';g.fillRect(x,y,T,1);g.fillStyle=c.d1;g.fillRect(x,y+5,T,1)}}
  else if(t==2){g.fillStyle='#c98b4a';g.fillRect(x,y,T,5);g.fillStyle='#e7b06e';g.fillRect(x,y,T,2);g.fillStyle='#8a5a2b';g.fillRect(x+2,y+5,2,3);g.fillRect(x+12,y+5,2,3)}
  else{g.fillStyle='#e9eeff';for(let i=0;i<3;i++){g.beginPath();g.moveTo(x+i*5.3,y+T);g.lineTo(x+i*5.3+2.7,y+7);g.lineTo(x+i*5.3+5.3,y+T);g.fill()}}
 }
 const f=L.flag||{x:-99,y:-99};g.fillStyle='#f1f1f8';g.fillRect(f.x+7,f.y,2,48);g.fillStyle='#ffd166';g.fillRect(f.x+5,f.y-3,6,3);
 g.fillStyle='#ff4f7b';g.beginPath();g.moveTo(f.x+9,f.y);g.lineTo(f.x+25,f.y+6+Math.sin(tick*.12)*2);g.lineTo(f.x+9,f.y+14);g.fill();
 for(const m of L.gems){if(m.got)continue;const x=m.x*T,y=m.y*T+Math.sin(tick*.06+m.x)*2,w=Math.abs(Math.cos(tick*.05+m.x))*5+1;
  g.fillStyle='#4de3ff';g.beginPath();g.moveTo(x,y-6);g.lineTo(x+w,y);g.lineTo(x,y+6);g.lineTo(x-w,y);g.fill();
  g.fillStyle='#ffffffb0';g.fillRect(x-1,y-4,1,3)}
 for(const e of L.ens){
  if(e.x+16<cx||e.x>cx+W||(!e.alive&&e.t<0))continue;
  const h=e.alive?10+Math.sin(tick*.15+e.x)*1.2:3;g.globalAlpha=e.alive?1:Math.max(e.t/25,0);
  g.fillStyle='#8a4fff';g.beginPath();g.moveTo(e.x-1,e.y+10);g.quadraticCurveTo(e.x+6,e.y+10-h*2,e.x+13,e.y+10);g.fill();
  if(e.alive){g.fillStyle='#fff';g.fillRect(e.x+3,e.y+4,3,3);g.fillRect(e.x+7,e.y+4,3,3);g.fillStyle='#222';const o=e.dir>0?1:0;g.fillRect(e.x+3+o,e.y+5,2,2);g.fillRect(e.x+7+o,e.y+5,2,2)}
  g.globalAlpha=1}
 if(L.boss&&!(L.boss.f>0&&(L.boss.f>>1)&1))drawBoss(L.boss);
 if(!(p.inv>0&&(p.inv>>2)&1)){
  g.save();g.translate(p.x+5,p.y+14);g.scale(1+p.sq,1-p.sq);
  const r=p.ground&&p.vx?Math.sin(p.run)*2:0;
  g.fillStyle='#3a2a6a';g.fillRect(-5+r,-2,4,2);g.fillRect(1-r,-2,4,2);
  g.fillStyle='#ff6b9a';g.beginPath();g.roundRect(-6,-14,12,13,4);g.fill();
  g.fillStyle='#ffd166';g.fillRect(-6,-11,12,2);
  const ex=p.face>0?0:-4;g.fillStyle='#fff';g.fillRect(ex,-8,3,4);g.fillRect(ex+4,-8,3,4);
  g.fillStyle='#1b1340';const o=p.face>0?2:0;g.fillRect(ex+o,-6,1,2);g.fillRect(ex+4+o,-6,1,2);
  g.restore()}
 for(const s of shots){g.fillStyle=s.c;g.globalAlpha=.45;g.beginPath();g.arc(s.x,s.y,s.r+3,0,7);g.fill();g.globalAlpha=1;g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}
 for(const q of parts){g.globalAlpha=clamp(q.l/20,0,1);g.fillStyle=q.c;g.fillRect(q.x,q.y,2,2)}
 g.globalAlpha=1;g.restore();
 g.font='bold 11px system-ui,sans-serif';g.textBaseline='top';
 const tx=(s,x,y,al)=>{g.textAlign=al;g.fillStyle='#0009';g.fillText(s,x+1,y+1);g.fillStyle='#fff';g.fillText(s,x,y)};
 for(let i=0;i<3;i++)heart(13+i*15,6,i<hp);
 tx((L.boss?'BOSS ':'LV ')+n,W/2,6,'center');tx((L.boss?'':'◆ '+gotG+'/'+L.gems.length+'  ')+score,W-8,6,'right');
 if(L.boss){const B=L.boss,bw=130,bx=(W-bw)/2;g.fillStyle='#0009';g.fillRect(bx-1,21,bw+2,7);g.fillStyle=B.d[1];g.fillRect(bx,22,bw*Math.max(B.hp,0)/B.max,5);
  if(B.t<130){g.globalAlpha=Math.min(1,(130-B.t)/30);g.font='bold 20px system-ui,sans-serif';tx(B.d[0].toUpperCase(),W/2,84,'center');g.font='bold 11px system-ui,sans-serif';g.globalAlpha=1}}
 g.restore();
}

/* ui + input */
function show(t,d,b){$('t').textContent=t;$('d').innerHTML=d;$('go').textContent=b;$('ov').classList.remove('h')}
$('go').onclick=()=>{
 snd(400,800,.1);
 if(state=='title'){score=0;hp=3;load(1)}else if(state=='dead'){score=lvScore;hp=3;load(n)}else if(state=='win'){hp=Math.min(3,hp+1);load(n+1)}
 state='play';$('ov').classList.add('h');$('go').blur();
};
addEventListener('keydown',e=>{const k=e.key;
 if(state!='play'&&(k=='Enter'||k==' ')){e.preventDefault();$('go').click();return}
 if(k=='ArrowLeft'||k=='a')K.l=1;else if(k=='ArrowRight'||k=='d')K.r=1;
 else if(k=='ArrowUp'||k=='w'||k==' '||k=='z'){if(!K.j)K.jp=1;K.j=1}else return;
 e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key;
 if(k=='ArrowLeft'||k=='a')K.l=0;else if(k=='ArrowRight'||k=='d')K.r=0;else if(k=='ArrowUp'||k=='w'||k==' '||k=='z')K.j=0});
addEventListener('blur',()=>K.l=K.r=K.j=0);
const hold=(id,on,off)=>{const e=$(id);
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();on();e.classList.add('on')});
 ['pointerup','pointercancel','pointerleave'].forEach(nm=>e.addEventListener(nm,()=>{off();e.classList.remove('on')}));
 e.addEventListener('contextmenu',ev=>ev.preventDefault())};
hold('bl',()=>K.l=1,()=>K.l=0);hold('br',()=>K.r=1,()=>K.r=0);hold('jump',()=>{K.jp=1;K.j=1},()=>K.j=0);
function fit(){const s=$('stage'),k=Math.min((s.clientWidth-16)/W,(s.clientHeight-16)/H);cv.style.width=fl(W*k)+'px';cv.style.height=fl(H*k)+'px'}
addEventListener('resize',fit);new ResizeObserver(fit).observe($('stage'));fit();

load(1);
show('GEMHOP','Collect gems, stomp slimes, reach the flag.<br>Arrows / A D to move · Space to jump<br>Jump again in mid-air for a double jump<br>A boss awaits every 10 levels'+(best?'<br>Best '+best:''),'Play');
let last=performance.now(),acc=0;
function loop(now){
 acc+=Math.min(now-last,100);last=now;
 while(acc>=16.67){
  if(state=='play')upd();else if(state=='title')cam=md(tick*.5,lv.LW*T-W);
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.08;q.l--}
  parts=parts.filter(q=>q.l>0);tick++;acc-=16.67}
 draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
